[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopaper"
version = "1.0.0"
description = "AUTONOMOUS_PAPER_AGENT_V1 - Solana memecoin autonomous PAPER trader. No real execution path exists."
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.34",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autopaper = "autopaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
